# Minimal Catppuccin Mocha prompt
# Renders as: ~/code/project main* ❯

format = "$directory$git_branch$git_status$character"
add_newline = false

[directory]
style = "bold #89b4fa"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "#a6e3a1"
format = "[$branch]($style)"

[git_status]
style = "#a6e3a1"
format = "[$modified$ahead_behind]($style) "
modified = "*"
ahead = "↑"
behind = "↓"
diverged = "↑↓"
# silence everything else
untracked = ""
staged = ""
renamed = ""
deleted = ""
conflicted = ""
stashed = ""

[character]
success_symbol = "[❯](#cba6f7)"
error_symbol = "[❯](#f38ba8)"

